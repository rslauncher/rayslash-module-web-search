[package]
name = "rayslash-module-web-search"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rslauncher/rayslash-module-web-search"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "rayslash:web-search"

[package.metadata.component.target]
path = "wit"
world = "module"
